# CNB 冒烟：个股新闻 + VIP 出口探测（不全量 Matrix、不推企微）
# 文档: https://docs.cnb.cool/zh/build/configuration.html

main:
  # 推送 main 时顺带跑一次，便于迁仓后立刻验证出口
  push:
    - name: stock-smoke-on-push
      docker:
        image: node:24
      stages:
        - name: smoke
          script: node scripts/cnb-stock-smoke.js

  # 分支详情页按钮：手动触发
  web_trigger_stock_smoke:
    - name: stock-smoke
      docker:
        image: node:24
      stages:
        - name: smoke
          script: |
            echo "SMOKE_CODES=${SMOKE_CODES:-sz002975,sz300750,sh688981}"
            node scripts/cnb-stock-smoke.js

"**":
  web_trigger_stock_smoke:
    - name: stock-smoke
      docker:
        image: node:24
      stages:
        - name: smoke
          script: |
            echo "SMOKE_CODES=${SMOKE_CODES:-sz002975,sz300750,sh688981}"
            node scripts/cnb-stock-smoke.js

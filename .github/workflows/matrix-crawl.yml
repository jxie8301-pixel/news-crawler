name: news-crawler matrix 分片实验

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 分片数
        required: false
        default: '4'

permissions:
  contents: read

jobs:
  scan:
    name: scan shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 准备配置与股票池
        env:
          SHARDS: ${{ github.event.inputs.shards || '4' }}
        run: |
          cp config.example.json config.json
          mkdir -p data/pools out
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/research.json >/dev/null || true
          curl -fsSL --retry 2 https://raw.githubusercontent.com/jxie8301-pixel/cls-news/data/pools/all-a.json \
            -o data/pools/all-a.json || \
          curl -fsSL --retry 2 "https://github.com/jxie8301-pixel/cls-news/raw/data/pools/all-a.json" \
            -o data/pools/all-a.json || echo "请手动提供 data/pools/all-a.json"

      - name: 扫描本片
        env:
          SHARDS: ${{ github.event.inputs.shards || '4' }}
        run: |
          node src/cli.js scan --shard ${{ matrix.shard }} --shards "$SHARDS"
        continue-on-error: true
        id: scan

      - name: 上传分片结果
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}-of-*.json
          if-no-files-found: warn

  merge:
    name: merge shards
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 下载全部分片
        env:
          SHARDS: ${{ github.event.inputs.shards || '4' }}
        run: |
          cp config.example.json config.json
          mkdir -p out
          for i in $(seq 0 $((SHARDS - 1))); do
            echo "expect shard $i"
          done

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: artifacts
          merge-multiple: true

      - name: 整理分片到 out/
        env:
          SHARDS: ${{ github.event.inputs.shards || '4' }}
        run: |
          mkdir -p out
          find artifacts -name 'shard-*-of-*.json' -exec cp {} out/ \;
          ls -la out/

      - name: 合并
        env:
          SHARDS: ${{ github.event.inputs.shards || '4' }}
        run: |
          set +e
          node src/cli.js merge --shards "$SHARDS"
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "整轮失败（含超时作废分片）"
            exit 0
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: merged-result
          path: out/merged.json

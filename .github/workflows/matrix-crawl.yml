name: news-crawler matrix 分片实验

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 分片数（真正决定并行路数）
        required: false
        default: '5'
      force:
        description: 强制扫描（忽略 VIP 差集门控）
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: VIP 差集门控
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      new_count: ${{ steps.check.outputs.new_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检查是否有新增 VIP
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set +e
          cp config.example.json config.json
          mkdir -p out
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="--force"; fi
          node src/cli.js gate $EXTRA
          code=$?
          if [ -f out/vip-gate.json ]; then
            NEW=$(node -e "const j=require('./out/vip-gate.json'); process.stdout.write(String(j.newCount||0))")
            echo "new_count=$NEW" >> "$GITHUB_OUTPUT"
          else
            echo "new_count=0" >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" -eq 3 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "无新增 VIP，跳过 matrix 扫描"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit $code
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vip-gate
          path: out/vip-gate.json
          if-no-files-found: ignore

  setup:
    name: setup matrix
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      shard_list: ${{ steps.gen.outputs.shard_list }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成分片列表
        id: gen
        env:
          INPUT_SHARDS: ${{ github.event.inputs.shards }}
        run: |
          set -e
          cp config.example.json config.json
          N="${INPUT_SHARDS}"
          if [ -z "$N" ]; then
            N=$(node -e "const c=require('./config.json'); process.stdout.write(String(c.matrixShards||5))")
          fi
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ] || [ "$N" -gt 32 ]; then
            echo "invalid shards=$N (允许 1–32)" >&2
            exit 1
          fi
          LIST=$(N="$N" node -e "const n=Number(process.env.N); console.log(JSON.stringify([...Array(n).keys()]))")
          echo "shards=$N" >> "$GITHUB_OUTPUT"
          echo "shard_list=$LIST" >> "$GITHUB_OUTPUT"
          echo "将并行 $N 片: $LIST"

  scan:
    name: scan shard ${{ matrix.shard }}
    needs: [gate, setup]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 准备配置与股票池
        run: |
          cp config.example.json config.json
          mkdir -p data/pools out
          curl -fsSL --retry 2 https://raw.githubusercontent.com/jxie8301-pixel/cls-news/data/pools/all-a.json \
            -o data/pools/all-a.json
          test -s data/pools/all-a.json
          node -e "const p=require('./data/pools/all-a.json'); console.log('pool', p.name||p.key, (p.stocks||[]).length)"

      - name: 扫描本片
        env:
          SHARDS: ${{ needs.setup.outputs.shards }}
        run: |
          node src/cli.js scan --shard ${{ matrix.shard }} --shards "$SHARDS"
        continue-on-error: true
        id: scan

      - name: 上传分片结果
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}-of-*.json
          if-no-files-found: warn

  merge:
    name: merge shards
    needs: [gate, setup, scan]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 准备
        env:
          SHARDS: ${{ needs.setup.outputs.shards }}
        run: |
          cp config.example.json config.json
          mkdir -p out
          echo "expect $SHARDS shards"

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: artifacts
          merge-multiple: true

      - name: 整理分片到 out/
        run: |
          mkdir -p out
          find artifacts -name 'shard-*-of-*.json' -exec cp {} out/ \;
          ls -la out/

      - name: 合并
        env:
          SHARDS: ${{ needs.setup.outputs.shards }}
        run: |
          set +e
          node src/cli.js merge --shards "$SHARDS"
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "整轮失败（含超时作废分片）"
            exit 0
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: merged-result
          path: out/merged.json

name: 推送复盘 T+1～T+5

# 影子期仅手动；切流后再打开 schedule（北京约 03:00 = UTC 19:00）。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 19 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.db.outputs.found }}
      pages_ok: ${{ steps.pagescfg.outcome == 'success' && steps.db.outputs.found == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 安装 sqlite3 CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - name: 取回 pushes.db (data 分支)
        id: db
        run: |
          mkdir -p data
          git fetch origin data --depth 1 || true
          if git cat-file -e origin/data:pushes.db 2>/dev/null; then
            git show origin/data:pushes.db > data/pushes.db
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            # 影子期：尝试从现网 Pages / 旧仓 data 拉
            curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/pushes.db -o data/pushes.db || true
            if [ -s data/pushes.db ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 计算 T0 / T+1～T+5
        if: steps.db.outputs.found == 'true'
        env:
          TZ: Asia/Shanghai
        run: node src/cli.js perf

      - name: 写回 pushes.db (data 分支，独立临时克隆)
        if: steps.db.outputs.found == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          SRC=$PWD
          WORK=$(mktemp -d)
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          else
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
            cd "$WORK"
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1
            cd "$SRC"
          fi

          cd "$WORK"
          cp "$SRC/data/pushes.db" pushes.db
          git add pushes.db
          if git diff --cached --quiet; then
            echo "pushes.db 无变更"
          else
            git commit -m "update pushes.db perf [skip ci]"
            git push -u origin HEAD:data
          fi
          cd "$SRC"
          exit 0

      - name: 组装发布目录（保留现网新闻页 + 更新 /perf）
        if: steps.db.outputs.found == 'true'
        run: |
          SITE=https://jxie8301-pixel.github.io/cls-news
          mkdir -p _site/cards _site/perf
          curl -fsSL --retry 2 "$SITE/index.html"        -o _site/index.html        || true
          curl -fsSL --retry 2 "$SITE/cards/index.html"  -o _site/cards/index.html  || true
          curl -fsSL --retry 2 "$SITE/news.csv"          -o _site/news.csv          || true
          curl -fsSL --retry 2 "$SITE/news.json"         -o _site/news.json         || true
          curl -fsSL --retry 2 "$SITE/status.json"       -o _site/status.json       || true
          curl -fsSL --retry 2 "$SITE/research.json"     -o _site/research.json     || true
          curl -fsSL --retry 2 "$SITE/updated.txt"       -o _site/updated.txt       || true
          if [ ! -s _site/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset=utf-8><title>cls-news</title><p><a href="perf/">推送复盘</a></p>' > _site/index.html
          fi
          cp public/perf/index.html _site/perf/index.html
          cp data/pushes.db _site/pushes.db
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/perf-updated.txt

      - name: 上传站点产物（不依赖本仓 Pages）
        if: steps.db.outputs.found == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: site-perf
          path: _site

      - uses: actions/configure-pages@v6
        id: pagescfg
        if: steps.db.outputs.found == 'true'
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        if: steps.db.outputs.found == 'true' && steps.pagescfg.outcome == 'success'
        with:
          path: _site

  deploy:
    needs: perf
    if: needs.perf.outputs.publish == 'true' && needs.perf.outputs.pages_ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

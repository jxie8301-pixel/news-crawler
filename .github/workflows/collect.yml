name: cls-news v2 · VIP 门控 + Matrix 采集 + 推送 + Pages

# 生产入口（影子期可先手动；切流后由 cls-trigger dispatch）。
# exit 3：无新增 VIP → soft skip
# exit 4：分片超时 / merge 失败 → soft skip（不推送、不抬水位、不发 Pages）

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 分片数
        required: false
        default: '5'
      force:
        description: 忽略 VIP 差集强制跑
        type: boolean
        required: false
        default: false
      assume_new_vip:
        description: 外部已判定有新 VIP；拉取 VIP 失败时软继续（不 exit 1）
        type: boolean
        required: false
        default: false
      enable_push:
        description: 是否推送企微（切流后默认 true；影子可改 false）
        type: boolean
        required: false
        default: true
      publish_pages:
        description: 是否发布本仓 GitHub Pages
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: VIP 差集门控
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 检查 VIP
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
          ASSUME_NEW_VIP: ${{ github.event.inputs.assume_new_vip }}
          D1_API_BASE: ${{ secrets.D1_API_BASE }}
          D1_WRITE_TOKEN: ${{ secrets.D1_WRITE_TOKEN }}
        run: |
          set +e
          cp config.example.json config.json
          mkdir -p out
          echo "gate 水位 ← Cloudflare D1 /api/vip-gate"
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="$EXTRA --force"; fi
          if [ "$ASSUME_NEW_VIP" = "true" ]; then EXTRA="$EXTRA --assume-new-vip"; fi
          node src/cli.js gate $EXTRA
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit $code; fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vip-gate
          path: out/vip-gate.json
          if-no-files-found: ignore

  setup:
    name: setup matrix
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      shard_list: ${{ steps.gen.outputs.shard_list }}
    steps:
      - uses: actions/checkout@v5
      - name: 生成分片列表
        id: gen
        env:
          INPUT_SHARDS: ${{ github.event.inputs.shards }}
        run: |
          set -e
          cp config.example.json config.json
          N="${INPUT_SHARDS}"
          if [ -z "$N" ]; then
            N=$(node -e "const c=require('./config.json'); process.stdout.write(String(c.matrixShards||5))")
          fi
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ] || [ "$N" -gt 32 ]; then
            echo "invalid shards=$N" >&2
            exit 1
          fi
          LIST=$(N="$N" node -e "const n=Number(process.env.N); console.log(JSON.stringify([...Array(n).keys()]))")
          echo "shards=$N" >> "$GITHUB_OUTPUT"
          echo "shard_list=$LIST" >> "$GITHUB_OUTPUT"

  scan:
    name: scan shard ${{ matrix.shard }}
    needs: [gate, setup]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 准备配置与股票池
        run: |
          cp config.example.json config.json
          mkdir -p data/pools out
          curl -fsSL --retry 2 https://raw.githubusercontent.com/jxie8301-pixel/cls-news/data/pools/all-a.json \
            -o data/pools/all-a.json || true
          if [ ! -s data/pools/all-a.json ]; then
            git fetch origin data --depth 1 || true
            if git cat-file -e origin/data:pools/all-a.json 2>/dev/null; then
              git show origin/data:pools/all-a.json > data/pools/all-a.json
            fi
          fi
          test -s data/pools/all-a.json
          node -e "const p=require('./data/pools/all-a.json'); console.log('pool', (p.stocks||[]).length)"
      - name: 扫描本片
        env:
          SHARDS: ${{ needs.setup.outputs.shards }}
        run: node src/cli.js scan --shard ${{ matrix.shard }} --shards "$SHARDS"
        continue-on-error: true
        id: scan
      - uses: actions/upload-artifact@v6
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}-of-*.json
          if-no-files-found: warn

  merge_post:
    name: merge + post + Pages
    needs: [gate, setup, scan]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.resolve.outputs.skipped }}
      publish_pages: ${{ steps.resolve.outputs.publish_pages }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 安装 sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - name: 准备配置与缓存（优先本仓 data，缺失则从现网 cls-news 种子）
        run: |
          cp config.example.json config.json
          mkdir -p data/pools out _site/cards _site/perf
          PROD_RAW=https://raw.githubusercontent.com/jxie8301-pixel/cls-news
          PROD_SITE=https://jxie8301-pixel.github.io/cls-news

          git fetch origin data --depth 1 || true
          if git cat-file -e origin/data:pushed.json 2>/dev/null; then
            git show origin/data:pushed.json > data/pushed.json
            echo "pushed.json ← 本仓 data"
          elif curl -fsSL --retry 2 "$PROD_RAW/data/pushed.json" -o data/pushed.json; then
            echo "种子 pushed.json ← 现网 data 分支"
          else
            rm -f data/pushed.json
          fi

          if git cat-file -e origin/data:pools/all-a.json 2>/dev/null; then
            git show origin/data:pools/all-a.json > data/pools/all-a.json
            echo "pools ← 本仓 data"
          elif curl -fsSL --retry 2 "$PROD_RAW/data/pools/all-a.json" -o data/pools/all-a.json; then
            echo "种子 pools/all-a.json ← 现网 data 分支"
          fi

          if git cat-file -e origin/data:pushes.db 2>/dev/null; then
            git show origin/data:pushes.db > data/pushes.db
            echo "pushes.db ← 本仓 data"
          elif curl -fsSL --retry 2 "$PROD_RAW/data/pushes.db" -o data/pushes.db; then
            echo "种子 pushes.db ← 现网 data 分支"
          elif curl -fsSL --retry 2 "$PROD_SITE/pushes.db" -o data/pushes.db; then
            echo "种子 pushes.db ← 现网 Pages"
          else
            rm -f data/pushes.db
          fi

          # 水位/调研：优先本仓 data/seeds，再退回现网 Pages
          if git cat-file -e origin/data:seeds/status.json 2>/dev/null; then
            git show origin/data:seeds/status.json > out/status.json
            echo "status ← 本仓 data/seeds"
          else
            curl -fsSL --retry 2 "$PROD_SITE/status.json" -o out/status.json || true
          fi
          if git cat-file -e origin/data:seeds/research.json 2>/dev/null; then
            git show origin/data:seeds/research.json > data/research.json
            echo "research ← 本仓 data/seeds"
          else
            curl -fsSL --retry 2 "$PROD_SITE/research.json" -o data/research.json || true
          fi

          ls -la data/ data/pools/ out/ || true

      - uses: actions/download-artifact@v7
        with:
          pattern: shard-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: vip-gate
          path: out
          merge-multiple: true

      - name: 整理分片
        run: |
          mkdir -p out
          find artifacts -name 'shard-*-of-*.json' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - name: merge
        id: merge
        env:
          SHARDS: ${{ needs.setup.outputs.shards }}
        run: |
          set +e
          node src/cli.js merge --shards "$SHARDS"
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "merge 失败（超时作废），跳过 post/Pages"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit $code

      - name: post（正文/调研/导出；企微可选；写 D1）
        id: post
        if: steps.merge.outputs.skipped != 'true'
        env:
          TZ: Asia/Shanghai
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ENABLE_PUSH: ${{ github.event.inputs.enable_push }}
          D1_API_BASE: ${{ secrets.D1_API_BASE }}
          D1_WRITE_TOKEN: ${{ secrets.D1_WRITE_TOKEN }}
          D1_SOURCE: gha
        run: |
          set +e
          EXTRA="--site-links"
          if [ "$ENABLE_PUSH" != "true" ]; then EXTRA="$EXTRA --no-push"; fi
          node src/cli.js post $EXTRA
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit $code

      - name: 影子对照（只读现网 Pages）
        if: steps.merge.outputs.skipped != 'true' && steps.post.outputs.skipped != 'true'
        continue-on-error: true
        run: node src/cli.js shadow

      - name: 上传流水线产物
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-out
          path: |
            out/merged.json
            out/vip-gate.json
            out/shadow-report.json
            out/status.json
            out/cls-news-latest.json
            out/cls-news-latest.html
            out/cls-news-cards.html
          if-no-files-found: ignore

      - name: 汇总是否跳过发布
        id: resolve
        if: always()
        env:
          WANT_PAGES: ${{ github.event.inputs.publish_pages }}
        run: |
          if [ "${{ steps.merge.outputs.skipped }}" = "true" ] || [ "${{ steps.post.outputs.skipped }}" = "true" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.merge.outcome }}" != "success" ] || [ "${{ steps.post.outcome }}" = "failure" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$WANT_PAGES" = "true" ]; then
            echo "publish_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 写回 data 分支（独立临时克隆，不切换当前工作区）
        if: steps.resolve.outputs.skipped != 'true'
        continue-on-error: true
        run: |
          set +e
          if [ ! -f data/pushed.json ] && [ ! -f data/pools/all-a.json ] && [ ! -f data/pushes.db ]; then
            echo "无 data 产物，跳过"
            exit 0
          fi

          SRC=$PWD
          WORK=$(mktemp -d)
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 优先浅克隆已有 data；没有则从默认分支建 orphan
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          else
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
            cd "$WORK"
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1
            cd "$SRC"
          fi

          cd "$WORK"
          [ -f "$SRC/data/pushed.json" ] && cp "$SRC/data/pushed.json" pushed.json && git add pushed.json
          if [ -f "$SRC/data/pools/all-a.json" ]; then
            mkdir -p pools
            cp "$SRC/data/pools/all-a.json" pools/all-a.json
            git add pools/all-a.json
          fi
          [ -f "$SRC/data/pushes.db" ] && cp "$SRC/data/pushes.db" pushes.db && git add pushes.db
          mkdir -p seeds
          [ -f "$SRC/out/status.json" ] && cp "$SRC/out/status.json" seeds/status.json && git add seeds/status.json
          [ -f "$SRC/data/research.json" ] && cp "$SRC/data/research.json" seeds/research.json && git add seeds/research.json

          if git diff --cached --quiet; then
            echo "data 分支无变更"
          else
            git commit -m "update pushed + pool + pushes.db + seeds [skip ci]"
            git push -u origin HEAD:data
            echo "data 分支 push exit=$?"
          fi
          cd "$SRC"
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 组装 _site（保留本仓 perf / pushes.db）
        if: steps.resolve.outputs.skipped != 'true'
        run: |
          SITE=https://jxie8301-pixel.github.io/news-crawler
          mkdir -p _site/cards _site/perf
          cp out/cls-news-latest.html _site/index.html
          cp out/cls-news-cards.html  _site/cards/index.html
          cp out/cls-news-latest.csv  _site/news.csv
          cp out/cls-news-latest.json _site/news.json
          cp out/status.json          _site/status.json
          cp data/research.json       _site/research.json || true
          cp public/perf/index.html   _site/perf/index.html
          # 尽量保留本仓线上已有 pushes.db；本轮有则覆盖
          curl -fsSL --retry 2 "$SITE/pushes.db" -o _site/pushes.db || true
          [ -f data/pushes.db ] && cp data/pushes.db _site/pushes.db
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/updated.txt

      - name: 上传站点产物（影子期可下载验收，不依赖 Pages）
        if: steps.resolve.outputs.skipped != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: _site
          if-no-files-found: warn

      - uses: actions/configure-pages@v6
        if: steps.resolve.outputs.skipped != 'true' && steps.resolve.outputs.publish_pages == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        if: steps.resolve.outputs.skipped != 'true' && steps.resolve.outputs.publish_pages == 'true'
        with:
          path: _site

  deploy:
    needs: [gate, merge_post]
    if: needs.gate.outputs.should_run == 'true' && needs.merge_post.result == 'success' && needs.merge_post.outputs.skipped != 'true' && needs.merge_post.outputs.publish_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

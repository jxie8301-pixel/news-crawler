name: cls-news v2 · VIP 门控 + Matrix 采集 + 推送 + Pages

# 生产入口（影子期可先手动；切流后由 cls-trigger dispatch）。
# exit 3：无新增 VIP → soft skip
# exit 4：分片超时 / merge 失败 → soft skip（不推送、不抬水位、不发 Pages）

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 分片数
        required: false
        default: '5'
      force:
        description: 忽略 VIP 差集强制跑
        type: boolean
        required: false
        default: false
      enable_push:
        description: 是否推送企微（影子期请保持 false）
        type: boolean
        required: false
        default: false
      publish_pages:
        description: 是否发布本仓 GitHub Pages（需先在 Settings→Pages 启用 Actions 源；影子期可 false）
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: VIP 差集门控
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检查 VIP
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set +e
          cp config.example.json config.json
          mkdir -p out
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="--force"; fi
          node src/cli.js gate $EXTRA
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit $code; fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vip-gate
          path: out/vip-gate.json
          if-no-files-found: ignore

  setup:
    name: setup matrix
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      shard_list: ${{ steps.gen.outputs.shard_list }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成分片列表
        id: gen
        env:
          INPUT_SHARDS: ${{ github.event.inputs.shards }}
        run: |
          set -e
          cp config.example.json config.json
          N="${INPUT_SHARDS}"
          if [ -z "$N" ]; then
            N=$(node -e "const c=require('./config.json'); process.stdout.write(String(c.matrixShards||5))")
          fi
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ] || [ "$N" -gt 32 ]; then
            echo "invalid shards=$N" >&2
            exit 1
          fi
          LIST=$(N="$N" node -e "const n=Number(process.env.N); console.log(JSON.stringify([...Array(n).keys()]))")
          echo "shards=$N" >> "$GITHUB_OUTPUT"
          echo "shard_list=$LIST" >> "$GITHUB_OUTPUT"

  scan:
    name: scan shard ${{ matrix.shard }}
    needs: [gate, setup]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 准备配置与股票池
        run: |
          cp config.example.json config.json
          mkdir -p data/pools out
          curl -fsSL --retry 2 https://raw.githubusercontent.com/jxie8301-pixel/cls-news/data/pools/all-a.json \
            -o data/pools/all-a.json || true
          if [ ! -s data/pools/all-a.json ]; then
            git fetch origin data --depth 1 || true
            if git cat-file -e origin/data:pools/all-a.json 2>/dev/null; then
              git show origin/data:pools/all-a.json > data/pools/all-a.json
            fi
          fi
          test -s data/pools/all-a.json
          node -e "const p=require('./data/pools/all-a.json'); console.log('pool', (p.stocks||[]).length)"
      - name: 扫描本片
        env:
          SHARDS: ${{ needs.setup.outputs.shards }}
        run: node src/cli.js scan --shard ${{ matrix.shard }} --shards "$SHARDS"
        continue-on-error: true
        id: scan
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}-of-*.json
          if-no-files-found: warn

  merge_post:
    name: merge + post + Pages
    needs: [gate, setup, scan]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.resolve.outputs.skipped }}
      publish_pages: ${{ steps.resolve.outputs.publish_pages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - name: 准备配置与缓存
        run: |
          cp config.example.json config.json
          mkdir -p data/pools out _site/cards _site/perf
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/research.json -o data/research.json || true
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/status.json -o out/status.json || true
          git fetch origin data --depth 1 || true
          if git cat-file -e origin/data:pushed.json 2>/dev/null; then
            git show origin/data:pushed.json > data/pushed.json
          fi
          if git cat-file -e origin/data:pools/all-a.json 2>/dev/null; then
            git show origin/data:pools/all-a.json > data/pools/all-a.json
          fi
          if git cat-file -e origin/data:pushes.db 2>/dev/null; then
            git show origin/data:pushes.db > data/pushes.db
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: vip-gate
          path: out
          merge-multiple: true

      - name: 整理分片
        run: |
          mkdir -p out
          find artifacts -name 'shard-*-of-*.json' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - name: merge
        id: merge
        env:
          SHARDS: ${{ needs.setup.outputs.shards }}
        run: |
          set +e
          node src/cli.js merge --shards "$SHARDS"
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "merge 失败（超时作废），跳过 post/Pages"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit $code

      - name: post（正文/调研/导出；企微可选）
        id: post
        if: steps.merge.outputs.skipped != 'true'
        env:
          TZ: Asia/Shanghai
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ENABLE_PUSH: ${{ github.event.inputs.enable_push }}
        run: |
          set +e
          EXTRA="--site-links"
          if [ "$ENABLE_PUSH" != "true" ]; then EXTRA="$EXTRA --no-push"; fi
          node src/cli.js post $EXTRA
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit $code

      - name: 汇总是否跳过发布
        id: resolve
        if: always()
        env:
          WANT_PAGES: ${{ github.event.inputs.publish_pages }}
        run: |
          if [ "${{ steps.merge.outputs.skipped }}" = "true" ] || [ "${{ steps.post.outputs.skipped }}" = "true" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.merge.outcome }}" != "success" ] || [ "${{ steps.post.outcome }}" = "failure" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$WANT_PAGES" = "true" ]; then
            echo "publish_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 写回 data 分支
        if: steps.resolve.outputs.skipped != 'true'
        run: |
          if [ ! -f data/pushed.json ] && [ ! -f data/pools/all-a.json ] && [ ! -f data/pushes.db ]; then
            echo "无 data 产物，跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          [ -f data/pushed.json ] && cp data/pushed.json "$tmp/pushed.json"
          [ -f data/pools/all-a.json ] && mkdir -p "$tmp/pools" && cp data/pools/all-a.json "$tmp/pools/all-a.json"
          [ -f data/pushes.db ] && cp data/pushes.db "$tmp/pushes.db"
          git fetch origin data --depth 1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          [ -f "$tmp/pushed.json" ] && cp "$tmp/pushed.json" pushed.json && git add pushed.json
          if [ -f "$tmp/pools/all-a.json" ]; then
            mkdir -p pools
            cp "$tmp/pools/all-a.json" pools/all-a.json
            git add pools/all-a.json
          fi
          [ -f "$tmp/pushes.db" ] && cp "$tmp/pushes.db" pushes.db && git add pushes.db
          git commit -m "update pushed + pool + pushes.db [skip ci]" || echo "无变化"
          git push origin data || echo "push data 失败（影子期可无 write）"
          git checkout -

      - name: 组装 _site（保留现网 perf）
        if: steps.resolve.outputs.skipped != 'true'
        run: |
          SITE=https://jxie8301-pixel.github.io/cls-news
          mkdir -p _site/cards _site/perf
          cp out/cls-news-latest.html _site/index.html
          cp out/cls-news-cards.html  _site/cards/index.html
          cp out/cls-news-latest.csv  _site/news.csv
          cp out/cls-news-latest.json _site/news.json
          cp out/status.json          _site/status.json
          cp data/research.json       _site/research.json || true
          cp public/perf/index.html   _site/perf/index.html
          # 尽量保留线上已有 pushes.db；本轮有则覆盖
          curl -fsSL --retry 2 "$SITE/pushes.db" -o _site/pushes.db || true
          [ -f data/pushes.db ] && cp data/pushes.db _site/pushes.db
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/updated.txt

      - name: 上传站点产物（影子期可下载验收，不依赖 Pages）
        if: steps.resolve.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          if-no-files-found: warn

      - uses: actions/configure-pages@v5
        if: steps.resolve.outputs.skipped != 'true' && steps.resolve.outputs.publish_pages == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.resolve.outputs.skipped != 'true' && steps.resolve.outputs.publish_pages == 'true'
        with:
          path: _site

  deploy:
    needs: [gate, merge_post]
    if: needs.gate.outputs.should_run == 'true' && needs.merge_post.result == 'success' && needs.merge_post.outputs.skipped != 'true' && needs.merge_post.outputs.publish_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
